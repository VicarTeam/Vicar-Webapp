server {
 listen 80;
 server_name localhost;
 root /usr/share/nginx/html;
 index index.html index.htm;

 # Single-Origin: /api intern ans Backend proxen, statt es vom SPA-Fallback
 # schlucken zu lassen. Backend mountet alle Routen unter / UND /api -> der volle
 # /api-Pfad wird durchgereicht. Variable + resolver => übersteht Backend-Neustarts
 # (Docker-DNS unter 127.0.0.11).
 location /api/ {
  resolver 127.0.0.11 valid=10s;
  set $vicar_backend backend;
  proxy_pass http://$vicar_backend:6660$request_uri;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  # Avatar-/Charakter-Uploads (base64) können groß sein.
  client_max_body_size 50m;
 }

 # Service-Worker und Manifest nie cachen, damit PWA-Updates zuverlässig greifen.
 location = /sw.js {
  add_header Cache-Control "no-cache, no-store, must-revalidate";
 }
 location = /registerSW.js {
  add_header Cache-Control "no-cache, no-store, must-revalidate";
 }
 location = /manifest.webmanifest {
  add_header Cache-Control "no-cache";
 }

 # Gehashte Build-Assets dürfen lange gecacht werden.
 location /assets/ {
  expires 1y;
  add_header Cache-Control "public, immutable";
 }

 location / {
  try_files $uri $uri/ /index.html;
 }
}
